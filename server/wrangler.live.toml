# Test config for tools/live_tests (never deployed): the real Worker against the Firebase emulators.
# Secrets-like values (TEST_*, EMULATOR_FIRESTORE, FIREBASE_SA) are passed with --var by tools/live_tests/run.sh.
name = "pointer-heads-live-test"
main = "test/live/entry.ts"
compatibility_date = "2026-09-01"

[vars]
PROJECT_ID = "demo-pointer"
ALLOWED_ORIGINS = "http://127.0.0.1:5050,http://localhost:5050"

[[durable_objects.bindings]]
name = "HUB"
class_name = "CampusHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CampusHub"]
