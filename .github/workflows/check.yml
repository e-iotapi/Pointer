name: check
# T0 + T1 (tools/qa/run.sh) and the production build guard. They live on
# pointer-dev only (master and pointer-beta carry no tests): they run on every
# push to pointer-dev and on pull requests into it, and release.yml calls them
# before pointer-dev is released to pointer-beta. T2 is qa.yml.
on:
  push:
    branches: [pointer-dev]
  pull_request:
    branches: [pointer-dev]
  workflow_call:
    inputs:
      ref:
        description: The branch to check
        type: string
        required: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # The SDK the suites, analyzer baseline and ui_check renders are kept on;
          # move it with them (a newer stable deprecates package:flutter/material.dart).
          flutter-version: 3.47.5
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install -g firebase-tools

      - run: flutter pub get
      - run: npm ci
        working-directory: test/rules
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: tools/test_env

      - name: T0 + T1 (analyzer vs tools/analyze_baseline.txt, Dart, Worker, tools, rules)
        run: tools/qa/run.sh --tier 0,1

      - name: logs
        if: failure()
        run: tail -n 60 build/qa/run/*.log

      - name: production build + prod guard (T1)
        run: |
          flutter build web --release --base-href /calculator/
          if grep -q 'pointer-test-only' build/web/main.dart.js; then
            echo "Test-only sign-in leaked into the production build." >&2
            exit 1
          fi
